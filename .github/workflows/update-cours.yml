name: Mise a jour automatique des cours et dividendes BRVM

on:
  schedule:
    # Tous les jours a 19h00 UTC (apres la cloture du marche BRVM, 15h GMT)
    - cron: '0 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-cours:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Executer le script de mise a jour des cours
        run: python3 scripts/update_cours.py

      - name: Executer le script de mise a jour des dividendes
        run: python3 scripts/update_dividendes.py

      - name: Enregistrer les fichiers s'ils ont change
        run: |
          git config user.name "brvm-cours-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- cours-auto.json dividendes-auto.json; then
            git add cours-auto.json dividendes-auto.json
            git commit -m "Mise a jour automatique des cours et dividendes BRVM"
            git push
          else
            echo "Aucun changement a enregistrer."
          fi

      - name: Installer firebase-admin
        run: pip install firebase-admin --quiet

      - name: Verifier les alertes de prix et envoyer les notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 scripts/check_alertes.py
