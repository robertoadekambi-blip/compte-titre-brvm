*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{

  color:var(--ink);

h1,h2,h3,.serif{font-family:'Source Serif 4',Georgia,serif;}
.tabular{font-variant-numeric:tabular-nums;}
#topbar{
  background:var(--navy);

}
.card .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.card[data-open]{cursor:pointer;position:relative;padding-right:34px;transition:background .12s;}
.card[data-open]:active{background:var(--gold-soft);}
.card[data-open]::after{

}

.card .montant{font-weight:600;font-size:1rem;white-space:nowrap;}
.card .montant.neg{color:var(--brick);}
.card .montant.pos{color:var(--good);}
.section-title{

.section-title:first-child{margin-top:4px;}
.section-title-row{
  display:flex;justify-content:space-between;align-items:center;
  margin:18px 2px 8px;
}
.section-title-row .section-title{margin:0;}
.inline-add.confirming{background:var(--gold);color:var(--navy);}
.inline-add{
  background:none;border:1px solid var(--gold);color:var(--gold);
  border-radius:999px;padding:4px 12px;font-size:.72rem;font-weight:600;
  font-family:inherit;cursor:pointer;
}
.total-strip{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--navy);color:#fff;border-radius:var(--radius);

.total-strip .label{font-size:.78rem;color:var(--gold-soft);}
.total-strip .value{font-size:1.25rem;font-weight:700;font-family:'Source Serif 4',serif;}
.total-strip .value[data-exact],.metric .value[data-exact]{cursor:pointer;border-bottom:1px dotted currentColor;}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.metric{

.metric .label{font-size:.7rem;color:var(--muted);margin-bottom:4px;}
.metric .value{font-size:1.05rem;font-weight:700;font-family:'Source Serif 4',serif;}

.vchart-half-down{height:66px;width:100%;display:flex;align-items:flex-start;justify-content:center;position:relative;border-top:1.5px solid var(--muted);}

.chart-row{display:flex;align-items:center;gap:8px;padding:5px 0;}

table.mini{width:100%;border-collapse:collapse;font-size:.82rem;}
table.mini th{text-align:left;font-weight:600;color:var(--muted);font-size:.68rem;

table.mini td.num{text-align:right;}

<script>
(function(){
"use strict";

/* ---------- state ---------- */
function uid(){ return Math.random().toString(36).slice(2,10); }

var STORAGE_KEY = 'brvm-compte-titre-v1';
var SEED_DATA_TEXT = document.getElementById('app-data').textContent;

function loadState(){
  try{
    var saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      var parsed = JSON.parse(saved);
      if(parsed && parsed.operations) return parsed;
    }
  }catch(e){ /* localStorage indisponible (mode privé strict, etc.) */ }
  try{
    var seeded = JSON.parse(SEED_DATA_TEXT);
    if(seeded && seeded.operations) return seeded;
  }catch(e){}
  return null;
}
var state = loadState();

/* ---------- outils : noms de titres, CUMP pondere, tri par date ---------- */
function normKey(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
}
var TICKER_ALIASES = {BOAMALI:'BOAM', BOABENIN:'BOAB', BOABURKINA:'BOABF', BOABURKINAFASO:'BOABF',
  BOACOTEDIVOIRE:'BOAC', BOANIGER:'BOAN', BOASENEGAL:'BOAS', SONATEL:'SNTS'};
function tickerOf(titre){ var k = normKey(titre); return TICKER_ALIASES[k] || k; }
function knownTitres(){
  var seen = {}, out = [];
  ['achats','ventes','dividendes'].forEach(function(l){
    (state[l]||[]).forEach(function(x){ if(x.titre && !seen[x.titre]){ seen[x.titre]=1; out.push(x.titre); } });
  });
  return out;
}
function canonicalTitre(name){
  var t = String(name||'').trim();
  var known = knownTitres();
  for(var i=0;i<known.length;i++){ if(normKey(known[i])===normKey(t)) return known[i]; }
  for(var j=0;j<known.length;j++){ if(tickerOf(known[j])===tickerOf(t)) return known[j]; }
  var tk = tickerOf(t);
  if(tk && autoTickers[tk]) return tk;
  return t;
}
function coursEffectifs(){
  var m = {};
  positionConsolidee().forEach(function(p){
    var i = coursInfoOf(p.titre);
    if(i) m[p.titre] = {cours:i.cours, date:i.date};
  });
  return m;
}
function byDate(a,b){ return String(a.date||'').localeCompare(String(b.date||'')); }
function todayISO(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function titreDatalist(){
  var seen = {}, opts = [];
  knownTitres().concat(Object.keys(autoTickers)).forEach(function(t){
    if(!seen[t]){ seen[t]=1; opts.push('<option value="'+esc(t)+'"></option>'); }
  });
  return '<datalist id="titres-list">'+opts.join('')+'</datalist>';
}

/* ---------- cours automatiques (recuperes via GitHub Actions, fichier cours-auto.json a la racine) ---------- */
var autoCours = {};
var autoCoursUpdatedAt = null;
var autoTickers = {};
function loadAutoCours(){
  var RAW = 'https://raw.githubusercontent.com/robertoadekambi-blip/compte-titre-brvm/main/cours-auto.json';
  function apply(data){
    autoCours = (data && data.cours) || {};
    autoTickers = (data && data.tickers) || {};
    autoCoursUpdatedAt = (data && data.updatedAt) || null;
    render();
  }
  function tryFetch(url){
    return fetch(url, {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('absent');
      return r.json();
    });
  }
  try{
    tryFetch(RAW).catch(function(){ return tryFetch('./cours-auto.json'); })
      .then(apply)
      .catch(function(){ /* pas de cours auto disponibles : l'app fonctionne comme avant */ });
  }catch(e){ /* fetch indisponible : pas grave */ }
}
var autoDividendes = {tickers:{}, autres:{}};
function loadAutoDividendes(){
  var RAW = 'https://raw.githubusercontent.com/robertoadekambi-blip/compte-titre-brvm/main/dividendes-auto.json';
  function apply(data){
    autoDividendes = {tickers:(data && data.tickers) || {}, autres:(data && data.autres) || {}};
    render();
  }
  function tryFetch(url){
    return fetch(url, {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('absent');
      return r.json();
    });
  }
  try{
    tryFetch(RAW).catch(function(){ return tryFetch('./dividendes-auto.json'); })
      .then(apply)
      .catch(function(){ /* pas de dividendes auto disponibles : l'app fonctionne comme avant */ });
  }catch(e){ /* fetch indisponible : pas grave */ }
}
function anneeFromDate(iso, exercice){
  if(iso) return Number(iso.slice(0,4));
  var e = parseInt(exercice,10);
  return e ? e+1 : new Date().getFullYear();
}
function autoDividendesSuggeres(){
  var out = [];
  // Pour chaque titre que l'utilisatrice possede ou a deja saisi, on cherche son code
  // BRVM et on regarde si le calendrier automatique connait un dividende pour ce code.
  knownTitres().forEach(function(titre){
    var code = tickerOf(titre);
    var entries = code ? (autoDividendes.tickers||{})[code] : null;
    (entries||[]).forEach(function(entry){
      var annee = anneeFromDate(entry.dateExDividende, entry.exercice);
      var dejaManuel = state.dividendes.some(function(d){ return d.titre===titre && Number(d.annee)===annee; });
      if(dejaManuel) return;
      out.push({
        id: 'auto-'+titre+'-'+annee,
        titre: titre, annee: annee,
        dateDetachement: entry.dateExDividende,
        dividendeParAction: entry.montant,
        source: 'auto'
      });
    });
  });
  return out;
}
// Pour une ligne DEJA saisie a la main, l'ecart eventuel avec la valeur publiee par la
// BRVM (montant different pour le meme titre+annee) — jamais applique automatiquement.
function ecartAutoPourLigne(d){
  var code = tickerOf(d.titre);
  var entries = (autoDividendes.tickers||{})[code];
  if(!entries) return null;
  var m = entries.find(function(e){ return anneeFromDate(e.dateExDividende, e.exercice)===Number(d.annee); });
  if(!m) return null;
  var montantDiffere = Math.abs(Number(m.montant) - Number(d.dividendeParAction)) >= 0.01;
  var dateDiffere = (d.dateDetachement||null) !== (m.dateExDividende||null);
  if(!montantDiffere && !dateDiffere) return null;
  return m;
}

/* ---------- persistance locale (aucune dépendance à Claude ou à internet) ---------- */
var saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 200);
}
function doSave(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* stockage plein ou indisponible : la session reste utilisable, juste non sauvegardée */ }
}

/* ---------- calculations ---------- */
function total1(){
  // Les frais de versement (ex: frais de virement bancaire) ne sont jamais credites
  // sur le compte : ils sont suivis a part (totalFraisOperations) mais n'entrent dans
  // aucun calcul de total, de liquidite ou de performance.
  return state.operations.reduce(function(s,o){return s+Number(o.montant||0);},0);
}
function totalFraisOperations(){
  return state.operations.reduce(function(s,o){return s+Number(o.frais||0);},0);
}
function anneeFromFreeDate(txt){
  var m = String(txt||'').match(/(19|20)\d{2}/);
  return m ? m[0] : null;
}
function fraisOperationsParAnnee(){
  var map = {};
  state.operations.forEach(function(o){
    if(!o.frais) return;
    var annee = anneeFromFreeDate(o.date) || 'Sans date';
    if(!map[annee]) map[annee] = {annee:annee, total:0};
    map[annee].total += Number(o.frais||0);
  });
  return Object.keys(map).sort().map(function(k){ return map[k]; });
}
function total2(){
  return state.achats.reduce(function(s,a){return s+Number(a.cump||0)*Number(a.qte||0);},0);
}
function cumpAt(titre, date){
  function calc(filterDate){
    var q = 0, m = 0;
    state.achats.forEach(function(a){
      if(a.titre !== titre) return;
      if(filterDate && a.date && a.date > filterDate) return;
      q += Number(a.qte||0); m += Number(a.qte||0)*Number(a.cump||0);
    });
    return q ? m/q : 0;
  }
  var v = date ? calc(date) : 0;
  return v || calc(null);
}
function cumpOf(titre){ return cumpAt(titre, null); }
function totalVentes(){
  return state.ventes.reduce(function(s,v){return s+Number(v.qte||0)*Number(v.prixVente||0);},0);
}
function plusValueTotal(){
  return state.ventes.reduce(function(s,v){
    return s+(Number(v.prixVente||0)-cumpAt(v.titre, v.date))*Number(v.qte||0);
  },0);
}
function positionConsolidee(){
  var map = {};
  state.achats.forEach(function(a){
    if(!map[a.titre]) map[a.titre] = {titre:a.titre, qte:0};
    map[a.titre].qte += Number(a.qte||0);
  });
  state.ventes.forEach(function(v){
    if(!map[v.titre]) map[v.titre] = {titre:v.titre, qte:0};
    map[v.titre].qte -= Number(v.qte||0);
  });
  return Object.keys(map).map(function(titre){
    var qte = map[titre].qte;
    return {titre:titre, qte:qte, montant: qte*cumpOf(titre)};
  });
}
function coursInfoOf(titre){
  var manual = state.coursActuels[titre];
  if(manual && manual.cours!=null && manual.cours!==''){
    return {cours:Number(manual.cours), date:manual.date||'', source:'manuel'};
  }
  var auto = autoInfoOf(titre);
  if(auto && auto.cours!=null){
    return {cours:Number(auto.cours), date:auto.date||'', source:'auto'};
  }
  return null;
}
function autoInfoOf(titre){
  return autoCours[titre] || autoTickers[tickerOf(titre)] || null;
}
function coursActuelOf(titre){
  var info = coursInfoOf(titre);
  return info ? info.cours : null;
}
function valeurMarchandeTotal(){
  return positionConsolidee().reduce(function(s,p){
    var cours = coursActuelOf(p.titre);
    var prix = (cours!=null) ? cours : cumpOf(p.titre);
    return s + p.qte*prix;
  },0);
}
function plusValueLatenteTotal(){
  return positionConsolidee().reduce(function(s,p){
    var cours = coursActuelOf(p.titre);
    if(cours==null) return s;
    return s + (cours - cumpOf(p.titre))*p.qte;
  },0);
}
function toutCoursRenseignes(){
  return positionConsolidee().every(function(p){ return coursActuelOf(p.titre)!=null; });
}
function performanceGlobale(){
  var capital = total2();
  if(capital===0) return 0;
  return (valeurMarchandeTotal() + totalDividendesAll() + totalVentes() - capital) / capital;
}
function enrichOne(d){
  var achLots = state.achats.filter(function(a){
    return a.titre === d.titre && d.dateDetachement && a.date <= d.dateDetachement;
  });
  var vteLots = state.ventes.filter(function(v){
    return v.titre === d.titre && d.dateDetachement && v.date <= d.dateDetachement;
  });
  var nbAch = achLots.reduce(function(s,a){return s+Number(a.qte||0);},0);
  var nbVte = vteLots.reduce(function(s,v){return s+Number(v.qte||0);},0);
  var nb = Math.max(0, nbAch - nbVte);
  var capital = nb * cumpAt(d.titre, d.dateDetachement);
  var total = Number(d.dividendeParAction||0) * nb;
  return Object.assign({}, d, {nbTitresRetenu:nb, total:total, capitalRetenu:capital});
}
function enrichDividendes(){
  // Seules les lignes confirmees (saisies ou validees par l'utilisateur) comptent dans
  // les totaux, la synthese et la liquidite theorique. Les suggestions automatiques non
  // validees n'y figurent jamais : voir enrichSuggestions() pour leur affichage a part.
  return state.dividendes.map(enrichOne);
}
function enrichSuggestions(){
  return autoDividendesSuggeres().map(enrichOne);
}
function totalsByYear(){
  var enriched = enrichDividendes();
  var map = {};
  enriched.forEach(function(d){
    if(!map[d.annee]) map[d.annee] = {annee:d.annee, total:0, capital:0};
    map[d.annee].total += d.total;
    map[d.annee].capital += d.capitalRetenu;
  });
  return Object.values(map).sort(function(a,b){return a.annee-b.annee;});
}
function totalsByTitre(){
  var enriched = enrichDividendes();
  var map = {};
  enriched.forEach(function(d){
    if(!map[d.titre]) map[d.titre] = {titre:d.titre, total:0};
    map[d.titre].total += d.total;
  });
  return Object.values(map).sort(function(a,b){return b.total-a.total;});
}
function totalDividendesAll(){
  return enrichDividendes().reduce(function(s,d){return s+d.total;},0);
}
function totalFrais(){
  return state.mouvements.filter(function(m){return m.type==='Frais';})
    .reduce(function(s,m){return s+Number(m.montant||0);},0);
}
function totalAutres(){
  return state.mouvements.filter(function(m){return m.type==='Autre';})
    .reduce(function(s,m){return s+Number(m.montant||0);},0);
}
function fraisAutresParAnnee(){
  var map = {};
  state.mouvements.forEach(function(m){
    if(!m.annee) return;
    if(!map[m.annee]) map[m.annee] = {annee:m.annee, frais:0, autres:0};
    if(m.type==='Frais') map[m.annee].frais += Number(m.montant||0);
    if(m.type==='Autre') map[m.annee].autres += Number(m.montant||0);
  });
  return Object.values(map).sort(function(a,b){return a.annee-b.annee;});
}
function liquiditeTheorique(){
  return total1() - total2() + totalDividendesAll() + totalFrais() + totalAutres() + totalVentes();
}
function ecart(){
  return Number(state.liquiditeReelle.montant||0) - liquiditeTheorique();
}

/* ---------- formatting ---------- */
function fmtFull(n){
  n = Math.round((Number(n)||0)*100)/100;
  var parts = n.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2});
  return parts + ' F CFA';
}
function fmtPct(n){ return (Math.round(n*10000)/100).toLocaleString('fr-FR') + ' %'; }
function fmtCompact(n){
  n = Number(n)||0;
  var sign = n<0 ? '-' : '';
  var abs = Math.abs(n);
  if(abs >= 1000000) return sign+(Math.round(abs/100000)/10).toLocaleString('fr-FR')+'M';
  if(abs >= 1000) return sign+Math.round(abs/1000)+'k';
  return sign+Math.round(abs);
}
function fmt(n){
  // En dessous d'un million, la valeur complete est plus lisible et ne surcharge
  // pas l'affichage ; au-dela, le format compact (k/M) reste plus clair.
  return (Math.abs(Number(n)||0) < 1000000) ? fmtFull(n) : (fmtCompact(n) + ' F CFA');
}
function fmtDate(iso){
  if(!iso) return '—';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
  var p = iso.split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function vBarChartPercent(items){
  if(!items.length) return '';
  var total = items.reduce(function(s,i){return s+Math.abs(i.value);},0) || 1;
  var maxVal = 0;
  items.forEach(function(i){ maxVal = Math.max(maxVal, Math.abs(i.value)); });
  if(maxVal === 0) maxVal = 1;
  var cols = items.map(function(it){
    var pct = Math.abs(it.value)/total*100;
    var barPct = Math.max(4, Math.round(Math.abs(it.value)/maxVal*100));
    return '<div class="vchart-col" data-exact="'+esc(it.label)+' : '+fmtFull(it.value)+'">'+
      '<div class="vchart-bar-wrap">'+
      '<div class="vchart-value" style="bottom:calc('+barPct+'% + 4px);">'+pct.toFixed(1)+'%</div>'+
      '<div class="vchart-bar" style="height:'+barPct+'%;background:var(--gold);"></div>'+
      '</div>'+
      '<div class="vchart-label">'+esc(it.label)+'</div>'+
      '</div>';
  }).join('');
  return '<div class="vchart">'+cols+'</div>'+
    '<div class="helper" style="margin-top:2px;">Appuie sur une barre pour voir le montant exact.</div>';
}
function vBarChartMagnitude(items, opts){
  opts = opts || {};
  if(!items.length) return '';
  var maxVal = 0;
  items.forEach(function(i){ maxVal = Math.max(maxVal, Math.abs(i.value)); });
  if(maxVal === 0) maxVal = 1;
  var cols = items.map(function(it){
    var barPct = Math.max(4, Math.round(Math.abs(it.value)/maxVal*100));
    var color = it.value < 0 ? 'var(--brick)' : (opts.color || 'var(--gold)');
    return '<div class="vchart-col" data-exact="'+esc(it.label)+' : '+fmtFull(it.value)+'">'+
      '<div class="vchart-bar-wrap">'+
      '<div class="vchart-value" style="bottom:calc('+barPct+'% + 4px);">'+fmtCompact(it.value)+'</div>'+
      '<div class="vchart-bar" style="height:'+barPct+'%;background:'+color+';"></div>'+
      '</div>'+
      '<div class="vchart-label">'+esc(it.label)+'</div>'+
      '</div>';
  }).join('');
  return '<div class="vchart">'+cols+'</div>'+
    '<div class="helper" style="margin-top:2px;">Valeurs compactées (k = milliers, M = millions). Appuie sur une barre pour le montant exact.</div>';
}
function vBarChartSigned(items){
  if(!items.length) return '';
  var maxAbs = 0;
  items.forEach(function(i){ maxAbs = Math.max(maxAbs, Math.abs(i.value)); });
  if(maxAbs === 0) maxAbs = 1;
  var cols = items.map(function(it){
    var barPct = Math.max(3, Math.round(Math.abs(it.value)/maxAbs*100));
    var color = it.value < 0 ? 'var(--brick)' : 'var(--gold)';
    var bar = '<div class="vchart-bar-d" style="height:'+barPct+'%;background:'+color+';"></div>';
    var valueLabel = '<div class="vchart-value" style="'+
      (it.value>=0 ? ('bottom:calc('+barPct+'% + 4px);') : ('top:calc('+barPct+'% + 4px);'))+
      '">'+fmtCompact(it.value)+'</div>';
    return '<div class="vchart-div-col" data-exact="'+esc(it.label)+' : '+fmtFull(it.value)+'">'+
      '<div class="vchart-half-up">'+(it.value>=0?valueLabel:'')+(it.value>=0?bar:'')+'</div>'+
      '<div class="vchart-half-down">'+(it.value<0?valueLabel:'')+(it.value<0?bar:'')+'</div>'+
      '<div class="vchart-label">'+esc(it.label)+'</div>'+
      '</div>';
  }).join('');
  return '<div class="helper" style="margin:0 0 6px;">Échelle : ±'+fmtCompact(maxAbs)+' F CFA. La ligne horizontale = 0.</div>'+
    '<div class="vchart-div">'+cols+'</div>'+
    '<div class="helper" style="margin-top:8px;">Valeurs compactées (k = milliers, M = millions). Appuie sur une barre pour le montant exact.</div>';
}

var LISTE_LABELS = {
  operations: 'Versement', achats: 'Achat', ventes: 'Vente', dividendes: 'Dividende', mouvements: 'Mouvement'

function describeItem(listName, item){
  if(listName==='operations') return {titre: item.libelle, montant: Number(item.montant||0)};
  if(listName==='achats') return {titre: item.titre, montant: Number(item.cump||0)*Number(item.qte||0)};
  if(listName==='ventes') return {titre: item.titre, montant: Number(item.qte||0)*Number(item.prixVente||0)};
  if(listName==='dividendes') return {titre: item.titre+' · '+item.annee, montant: item.dividendeParAction+'/action'};
  if(listName==='mouvements') return {titre: item.libelle||item.type, montant: item.montant};
  return {titre:'—', montant:''};
}
function renderCorbeille(){
  if(!state.corbeille.length){
    return '<div class="empty">La corbeille est vide — les éléments supprimés apparaissent ici et restent récupérables.</div>';
  }
  var rows = state.corbeille.map(function(entry){
    var d = describeItem(entry.listName, entry.item);
    var when = entry.deletedAt ? new Date(entry.deletedAt).toLocaleString('fr-FR') : '';
    return '<div class="card">'+
      '<div class="row1"><span class="titre">'+esc(d.titre)+'</span>'+
      '<span class="montant tabular">'+(typeof d.montant==='number'?fmt(d.montant):esc(d.montant))+'</span></div>'+
      '<div class="meta">'+esc(LISTE_LABELS[entry.listName]||'')+' · supprimé le '+esc(when)+'</div>'+
      '<div class="sheet-actions" style="margin-top:10px;">'+
      '<button class="btn ghost" data-restore="'+entry.id+'">Restaurer</button>'+
      '<button class="btn danger" data-purge="'+entry.id+'">Supprimer définitivement</button>'+
      '</div></div>';
  }).join('');
  return '<div class="helper">Éléments supprimés — restaure-les ou vide la corbeille définitivement.</div>'+rows;
}

function buildSheetHtml(kind, item, formDef){

}

function openForm(kind, id){
  var item = null;
  var prefill = null;
  if(kind === 'cours'){
    item = state.coursActuels[id] || null;
    prefill = item;
  } else if(kind === 'dividendes' && id && String(id).indexOf('auto-')===0){
    var sugg = autoDividendesSuggeres().find(function(x){return x.id===id;});
    prefill = sugg ? {titre:sugg.titre, annee:sugg.annee, dateDetachement:sugg.dateDetachement, dividendeParAction:sugg.dividendeParAction} : null;
    item = null; id = null; // l'acceptation cree une nouvelle ligne manuelle, elle ne modifie pas l'auto
  } else if(kind !== 'liquidite-reelle' && id){
    item = state[formDef_list(kind)].find(function(x){return x.id===id;});
    prefill = item;
  }
  var formDef = FORMS[kind](prefill, id);
  openSheet(buildSheetHtml(kind, item, formDef));
  document.getElementById('btn-cancel').onclick = closeSheet;
  var useAutoBtn = document.getElementById('btn-use-auto');
  if(useAutoBtn){
    useAutoBtn.onclick = function(){
      delete state.coursActuels[id];
      closeSheet(); render(); scheduleSave();
    };
  }
  var useAutoDivBtn = document.getElementById('btn-use-auto-div');
  if(useAutoDivBtn && kind === 'dividendes'){
    useAutoDivBtn.onclick = function(){
      var ecart = ecartAutoPourLigne(item);
      if(!ecart) return;
      document.getElementById('f-div').value = ecart.montant;
      document.getElementById('f-dd').value = ecart.dateExDividende || '';
      var annee = anneeFromDate(ecart.dateExDividende, ecart.exercice);
      if(annee) document.getElementById('f-annee').value = annee;
    };
  }
  var delBtn = document.getElementById('btn-delete');
  if(delBtn){
    delBtn.onclick = function(){
      if(!delBtn.classList.contains('confirming')){
        delBtn.classList.add('confirming');
        delBtn.textContent = 'Confirmer la suppression ?';
        return;
      }
      var listName = formDef.list;
      var idx = state[listName].findIndex(function(x){return x.id===id;});
      if(idx > -1){
        var removed = state[listName].splice(idx,1)[0];
        state.corbeille.unshift({
          id: uid(), listName: listName, item: removed,
          deletedAt: new Date().toISOString()
        });
      }
      closeSheet(); render(); scheduleSave();
    };
  }
  document.getElementById('btn-save').onclick = function(){
    if(formDef.validate){
      var err = formDef.validate();
      if(err){ document.getElementById('form-error').textContent = err; return; }
    }
    var data = formDef.save();
    if(kind === 'liquidite-reelle'){
      state.liquiditeReelle = data;
    } else if(kind === 'cours'){
      if(data === null){ delete state.coursActuels[id]; }
      else { state.coursActuels[id] = data; }
    } else {
      var listName = formDef.list;
      if(item){
        Object.assign(item, data);
      } else {
        data.id = uid();
        state[listName].push(data);
      }
    }
    closeSheet(); render(); scheduleSave();
  };
}
function formDef_list(kind){
  return kind === 'mouvements' ? 'mouvements' :
         kind === 'dividendes' ? 'dividendes' :
         kind === 'ventes' ? 'ventes' :
         kind === 'achats' ? 'achats' : 'operations';
}

document.getElementById('app').addEventListener('change', function(e){
  if(e.target.id === 'file-import'){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var imported = JSON.parse(reader.result);
        if(!imported || !imported.operations) throw new Error('format invalide');
        state = imported;
        if(!state.corbeille) state.corbeille = [];
        if(!state.ventes) state.ventes = [];
        if(!state.coursActuels) state.coursActuels = {};
        render(); scheduleSave();
      }catch(err){
        alert('Fichier invalide — impossible d\'importer ces données.');
      }
    };
    reader.readAsText(file);
  }
});

/* ---------- Génération du classeur Excel (miroir du fichier .xlsx original) ---------- */
// Construit un classeur Excel (via ExcelJS) reproduisant la structure du fichier
// "Bilan du compte titre BRVM" a partir de l'etat de l'app (state).
// Fonctionne identiquement en Node (test) et dans le navigateur (ExcelJS UMD).
function buildWorkbook(ExcelJSLib, state){
  var CUR = '#,##0.00 "F CFA"';
  var PCT = '0.00%';
  var DATEFMT = 'dd/mm/yyyy';
  var NAVY = 'FF1F4E78', NAVY2='FF2E75B6', SUBHEAD='FFBDD7EE', TOTALFILL='FFD9E1F2';

  var wb = new ExcelJSLib.Workbook();
  wb.creator = 'Compte Titre BRVM';
  wb.created = new Date();

  var ws = wb.addWorksheet('Bilan');
  ws.columns = [
    {width:5},{width:26},{width:16},{width:16},{width:16},{width:18},{width:14}
  ];

  function titleRow(r, text, lastCol){
    ws.mergeCells(r,1,r,lastCol||6);
    var c = ws.getCell(r,1);
    c.value = text;
    c.font = {bold:true, size:12, color:{argb:'FFFFFFFF'}};
    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:NAVY2}};
    c.alignment = {horizontal:'center'};
  }
  function subheadRow(r, text, lastCol){
    ws.mergeCells(r,1,r,lastCol||7);
    var c = ws.getCell(r,1);
    c.value = text;
    c.font = {bold:true, size:10, color:{argb:NAVY}};
    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:SUBHEAD}};
    c.alignment = {horizontal:'center'};
  }
  function headerRow(r, headers){
    headers.forEach(function(h, i){
      var c = ws.getCell(r, i+1);
      c.value = h;
      c.font = {bold:true, size:11, color:{argb:'FFFFFFFF'}};
      c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:NAVY}};
      c.alignment = {horizontal:'center', wrapText:true};
      c.border = thinBorder();
    });
  }
  function thinBorder(){
    var s = {style:'thin', color:{argb:'FFB7B7B7'}};
    return {top:s,bottom:s,left:s,right:s};
  }
  function borderRow(r, ncols){
    for(var c=1;c<=ncols;c++) ws.getCell(r,c).border = thinBorder();
  }
  function inputCell(r,c,val,fmt,sheet){
    var cell = (sheet||ws).getCell(r,c);
    cell.value = val;
    cell.font = {color:{argb:'FF0000FF'}};
    if(fmt) cell.numFmt = fmt;
    return cell;
  }
  function formulaCell(r,c,formula,fmt,sheet){
    var cell = (sheet||ws).getCell(r,c);
    cell.value = {formula: formula};
    if(fmt) cell.numFmt = fmt;
    return cell;
  }
  function totalFillCell(r,c){
    ws.getCell(r,c).fill = {type:'pattern', pattern:'solid', fgColor:{argb:TOTALFILL}};
  }

  var row = 1;
  ws.mergeCells(1,1,1,7);
  ws.getCell(1,1).value = 'BILAN DU COMPTE TITRE BRVM';
  ws.getCell(1,1).font = {bold:true, size:14, color:{argb:NAVY}};
  ws.getCell(1,1).alignment = {horizontal:'center'};

  // ===== SECTION 1: OPERATIONS =====
  row = 3;
  titleRow(row, 'BILAN DES OPÉRATIONS', 6);
  row++;
  headerRow(row, ['N°','Libellé','Date','Montant net','Frais de virement','']);
  var startOps = row+1;
  state.operations.forEach(function(o, idx){
    var r = startOps + idx;
    ws.getCell(r,1).value = idx+1;
    ws.getCell(r,2).value = o.libelle;
    ws.getCell(r,3).value = o.date;
    inputCell(r,4,Number(o.montant)||0,CUR);
    inputCell(r,5,Number(o.frais)||0,CUR);
    borderRow(r,5);
  });
  var lastOps = startOps + state.operations.length - 1;
  var total1Row = lastOps+1;
  ws.mergeCells(total1Row,1,total1Row,3);
  ws.getCell(total1Row,1).value = 'Total 1 – Total des fonds versés (net, hors frais de virement)';
  ws.getCell(total1Row,1).font = {bold:true};
  ws.getCell(total1Row,1).alignment = {horizontal:'right'};
  for(var c=1;c<=5;c++){ totalFillCell(total1Row,c); ws.getCell(total1Row,c).border = thinBorder(); }
  var t1 = formulaCell(total1Row,4,'SUM(D'+startOps+':D'+lastOps+')',CUR);
  t1.font = {bold:true};
  var TOTAL1 = 'D'+total1Row;

  var totalFraisOpsRow = total1Row+1;
  ws.mergeCells(totalFraisOpsRow,1,totalFraisOpsRow,3);
  ws.getCell(totalFraisOpsRow,1).value = 'Dont total des frais de virement (information seule, non inclus ci-dessus)';
  ws.getCell(totalFraisOpsRow,1).alignment = {horizontal:'right'};
  formulaCell(totalFraisOpsRow,5,'SUM(E'+startOps+':E'+lastOps+')',CUR);
  borderRow(totalFraisOpsRow,5);

  // ===== SECTION 2: PORTEFEUILLE =====
  var sec2 = totalFraisOpsRow+2;
  titleRow(sec2, 'BILAN DU PORTEFEUILLE D\'ACTIONS', 7);
  var hrow2 = sec2+1;
  headerRow(hrow2, ['N°','Titre (Action)','CUMP','Nombre de titres','Montant investi','Date (libellé)','Date (valeur)']);
  var start2 = hrow2+1;
  state.achats.forEach(function(a, idx){
    var r = start2+idx;
    ws.getCell(r,1).value = idx+1;
    ws.getCell(r,2).value = a.titre;
    inputCell(r,3,Number(a.cump)||0,CUR);
    inputCell(r,4,Number(a.qte)||0,'#,##0');
    formulaCell(r,5,'C'+r+'*D'+r,CUR);
    ws.getCell(r,6).value = a.date;
    var dv = inputCell(r,7, a.date ? new Date(a.date) : null, DATEFMT);
    borderRow(r,7);
  });
  var last2 = start2 + state.achats.length - 1;
  var ACH_TITRE = '$B$'+start2+':$B$'+last2;
  var ACH_QTE = '$D$'+start2+':$D$'+last2;
  var ACH_MONTANT = '$E$'+start2+':$E$'+last2;
  var ACH_CUMP = '$C$'+start2+':$C$'+last2;
  var ACH_DATEVAL = '$G$'+start2+':$G$'+last2;
  function cumpMoyenF(r){
    return 'IFERROR(SUMIF('+ACH_TITRE+',B'+r+','+ACH_MONTANT+')/SUMIF('+ACH_TITRE+',B'+r+','+ACH_QTE+'),0)';
  }
  function cumpAtF(r, dateRef, prefix){
    prefix = prefix || '';
    return 'IFERROR(SUMIFS('+prefix+ACH_MONTANT+','+prefix+ACH_TITRE+',B'+r+','+prefix+ACH_DATEVAL+',"<="&'+dateRef+')/'+
           'SUMIFS('+prefix+ACH_QTE+','+prefix+ACH_TITRE+',B'+r+','+prefix+ACH_DATEVAL+',"<="&'+dateRef+'),'+cumpMoyenF(r)+')';
  }

  var total2Row = last2+1;
  ws.mergeCells(total2Row,1,total2Row,4);
  ws.getCell(total2Row,1).value = 'Total 2 – Total investi en titres (brut, avant ventes)';
  ws.getCell(total2Row,1).font = {bold:true};
  ws.getCell(total2Row,1).alignment = {horizontal:'right'};
  for(var c=1;c<=7;c++){ totalFillCell(total2Row,c); ws.getCell(total2Row,c).border = thinBorder(); }
  var t2 = formulaCell(total2Row,5,'SUM(E'+start2+':E'+last2+')',CUR);
  t2.font = {bold:true};
  var TOTAL2 = 'E'+total2Row;

  // ---- Ventes ----
  var ventesTitleRow = total2Row+2;
  subheadRow(ventesTitleRow, "Ventes d'actions", 7);
  var ventesHrow = ventesTitleRow+1;
  headerRow(ventesHrow, ['N°','Titre (Action)','Qté vendue','Prix de vente unit.','Montant vente','Plus/moins-value','Date (valeur)']);
  var ventesStart = ventesHrow+1;
  var ventesList = state.ventes || [];
  var ventesRowsCount = Math.max(ventesList.length, 1);
  for(var i=0;i<ventesRowsCount;i++){
    var r = ventesStart+i;
    var v = ventesList[i];
    ws.getCell(r,1).value = i+1;
    if(v){
      ws.getCell(r,2).value = v.titre;
      inputCell(r,3,Number(v.qte)||0,'#,##0');
      inputCell(r,4,Number(v.prixVente)||0,CUR);
      formulaCell(r,5,'C'+r+'*D'+r,CUR);
      formulaCell(r,6,'(D'+r+'-'+cumpAtF(r,'G'+r)+')*C'+r,CUR);
      inputCell(r,7, v.date ? new Date(v.date) : null, DATEFMT);
    } else {
      ws.getCell(r,3).numFmt = '#,##0';
      ws.getCell(r,4).numFmt = CUR;
      formulaCell(r,5,'IF(C'+r+'="","",C'+r+'*D'+r+')',CUR);
      formulaCell(r,6,'IF(C'+r+'="","",(D'+r+'-'+cumpAtF(r,'G'+r)+')*C'+r+')',CUR);
      ws.getCell(r,7).numFmt = DATEFMT;
    }
    borderRow(r,7);
  }
  var ventesLast = ventesStart+ventesRowsCount-1;
  var VTE_TITRE = '$B$'+ventesStart+':$B$'+ventesLast;
  var VTE_QTE = '$C$'+ventesStart+':$C$'+ventesLast;
  var VTE_MONTANT = '$E$'+ventesStart+':$E$'+ventesLast;
  var VTE_PV = '$F$'+ventesStart+':$F$'+ventesLast;
  var VTE_DATEVAL = '$G$'+ventesStart+':$G$'+ventesLast;

  var ventesTotalRow = ventesLast+1;
  ws.mergeCells(ventesTotalRow,1,ventesTotalRow,4);
  ws.getCell(ventesTotalRow,1).value = 'Total ventes';
  ws.getCell(ventesTotalRow,1).font = {bold:true};
  ws.getCell(ventesTotalRow,1).alignment = {horizontal:'right'};
  for(var c=1;c<=7;c++){ totalFillCell(ventesTotalRow,c); ws.getCell(ventesTotalRow,c).border = thinBorder(); }
  var tv = formulaCell(ventesTotalRow,5,'SUM('+VTE_MONTANT+')',CUR); tv.font={bold:true};
  var tpv = formulaCell(ventesTotalRow,6,'SUM('+VTE_PV+')',CUR); tpv.font={bold:true};
  var TOTAL_VENTES = 'E'+ventesTotalRow;
  var TOTAL_PV = 'F'+ventesTotalRow;

  // ---- Position consolidee ----
  var poscTitleRow = ventesTotalRow+2;
  subheadRow(poscTitleRow, "Position consolidée par titre (nette des ventes)", 7);
  var poscHrow = poscTitleRow+1;
  headerRow(poscHrow, ['N°','Titre','Nombre net de titres','Montant investi (net)','Cours actuel','Valeur actuelle','Plus-value latente']);
  var poscStart = poscHrow+1;
  var titresUniques = [];
  state.achats.forEach(function(a){ if(titresUniques.indexOf(a.titre)===-1) titresUniques.push(a.titre); });
  var coursActuels = state.coursActuels || {};
  titresUniques.forEach(function(titre, idx){
    var r = poscStart+idx;
    ws.getCell(r,1).value = idx+1;
    ws.getCell(r,2).value = titre;
    formulaCell(r,3,'SUMIF('+ACH_TITRE+',B'+r+','+ACH_QTE+')-SUMIF('+VTE_TITRE+',B'+r+','+VTE_QTE+')','#,##0');
    formulaCell(r,4,'C'+r+'*'+cumpMoyenF(r),CUR);
    var coursInfo = coursActuels[titre];
    var coursVal = (coursInfo && coursInfo.cours != null && coursInfo.cours !== '') ? Number(coursInfo.cours) : null;
    if(coursVal != null){
      inputCell(r,5,coursVal,CUR);
    } else {
      ws.getCell(r,5).numFmt = CUR;
    }
    formulaCell(r,6,'IF(E'+r+'="",D'+r+',C'+r+'*E'+r+')',CUR);
    formulaCell(r,7,'IF(E'+r+'="",0,(E'+r+'-'+cumpMoyenF(r)+')*C'+r+')',CUR);
    borderRow(r,7);
  });
  var poscLast = poscStart+titresUniques.length-1;
  var POSC_VALEUR = 'F'+poscStart+':F'+poscLast;
  var POSC_PVLAT = 'G'+poscStart+':G'+poscLast;

  // ===== SECTION 3: LIQUIDITE =====
  var sec3 = poscLast+3;
  titleRow(sec3, 'LIQUIDITÉ', 7);
  var hrow3 = sec3+1;
  headerRow(hrow3, ['N°','Type','Titre concerné','Libellé','Montant','Année','Date (libre)']);
  var start3 = hrow3+1;
  var n = 1;
  var r = start3;
  ws.getCell(r,1).value = n++;
  ws.getCell(r,2).value = 'Vente';
  ws.getCell(r,3).value = 'Toutes actions';
  ws.getCell(r,4).value = "Total ventes d'actions (voir Portefeuille)";
  formulaCell(r,5,TOTAL_VENTES,CUR);
  ws.getCell(r,6).value = '—';
  ws.getCell(r,7).value = 'cumulé';
  borderRow(r,7);
  var years = Array.from(new Set((state.dividendes||[]).map(function(d){return d.annee;}))).sort();
  var divMovementRows = {};
  years.forEach(function(y){
    r = start3 + n; n++;
    ws.getCell(r,1).value = n-1;
    ws.getCell(r,2).value = 'Dividende';
    ws.getCell(r,3).value = 'Toutes actions';
    ws.getCell(r,4).value = 'Total dividendes reçus '+y+' (voir onglet Dividendes)';
    ws.getCell(r,6).value = y;
    ws.getCell(r,7).value = '31/12/'+y;
    borderRow(r,7);
    divMovementRows[y] = r;
  });
  var mvList = state.mouvements || [];
  var mvStart = start3+n;
  mvList.forEach(function(m, idx){
    var rr = mvStart+idx;
    ws.getCell(rr,1).value = n+idx;
    ws.getCell(rr,2).value = m.type;
    ws.getCell(rr,3).value = m.titre || '';
    ws.getCell(rr,4).value = m.libelle || '';
    inputCell(rr,5,Number(m.montant)||0,CUR);
    if(m.annee) ws.getCell(rr,6).value = m.annee;
    ws.getCell(rr,7).value = m.date || '';
    borderRow(rr,7);
  });
  var last3 = mvList.length ? (mvStart+mvList.length-1) : (mvStart-1);
  // au moins une ligne vide si aucun mouvement manuel, pour que les plages SUMIF restent valides
  if(last3 < mvStart){ borderRow(mvStart,7); last3 = mvStart; }

  var recapRow = last3+1;
  ws.getCell(recapRow,3).value = 'Total dividendes';
  ws.getCell(recapRow,3).alignment = {horizontal:'right'};
  var tdiv = formulaCell(recapRow,5,'SUMIF(B'+start3+':B'+last3+',"Dividende",E'+start3+':E'+last3+')',CUR);

  var recapRow2 = recapRow+1;
  ws.getCell(recapRow2,3).value = 'Total frais';
  ws.getCell(recapRow2,3).alignment = {horizontal:'right'};
  formulaCell(recapRow2,5,'SUMIF(B'+start3+':B'+last3+',"Frais",E'+start3+':E'+last3+')',CUR);

  var recapRow3 = recapRow2+1;
  ws.getCell(recapRow3,3).value = 'Total autres mouvements';
  ws.getCell(recapRow3,3).alignment = {horizontal:'right'};
  formulaCell(recapRow3,5,'SUMIF(B'+start3+':B'+last3+',"Autre",E'+start3+':E'+last3+')',CUR);

  // ---- Frais & autres par annee ----
  var fyTitleRow = recapRow3+2;
  subheadRow(fyTitleRow, 'Frais & autres mouvements par année', 7);
  var fyHrow = fyTitleRow+1;
  headerRow(fyHrow, ['Année','Total frais','Total autres','','','','']);
  var fyStart = fyHrow+1;
  var fyYears = Array.from(new Set(mvList.filter(function(m){return m.annee;}).map(function(m){return m.annee;}))).sort();
  if(!fyYears.length) fyYears = years.length ? years : [new Date().getFullYear()];
  fyYears.forEach(function(y, idx){
    var rr = fyStart+idx;
    inputCell(rr,1,y);
    formulaCell(rr,2,'SUMIFS(E'+start3+':E'+last3+',B'+start3+':B'+last3+',"Frais",F'+start3+':F'+last3+',A'+rr+')',CUR);
    formulaCell(rr,3,'SUMIFS(E'+start3+':E'+last3+',B'+start3+':B'+last3+',"Autre",F'+start3+':F'+last3+',A'+rr+')',CUR);
    borderRow(rr,3);
  });
  var fyLast = fyStart+fyYears.length-1;

  var liqReelleRow = fyLast+2;
  ws.getCell(liqReelleRow,3).value = 'Liquidité réelle actuelle';
  ws.getCell(liqReelleRow,3).alignment = {horizontal:'right'};
  inputCell(liqReelleRow,5,Number(state.liquiditeReelle.montant)||0,CUR);
  ws.getCell(liqReelleRow,7).value = state.liquiditeReelle.date || '';

  var liqTheoRow = liqReelleRow+1;
  ws.getCell(liqTheoRow,3).value = 'Liquidité théorique';
  ws.getCell(liqTheoRow,3).font = {bold:true};
  ws.getCell(liqTheoRow,3).alignment = {horizontal:'right'};
  var lt = formulaCell(liqTheoRow,5,TOTAL1+'-'+TOTAL2+'+SUM(E'+start3+':E'+last3+')',CUR);
  lt.font = {bold:true}; totalFillCell(liqTheoRow,5); totalFillCell(liqTheoRow,3);
  var LIQ_THEO = 'E'+liqTheoRow, LIQ_REELLE = 'E'+liqReelleRow;

  var ecartRow = liqTheoRow+1;
  ws.getCell(ecartRow,3).value = 'Écart (doit valoir 0 si tout est saisi)';
  ws.getCell(ecartRow,3).font = {bold:true};
  ws.getCell(ecartRow,3).alignment = {horizontal:'right'};
  var ec = formulaCell(ecartRow,5,LIQ_REELLE+'-'+LIQ_THEO,CUR);
  ec.font = {bold:true}; totalFillCell(ecartRow,5); totalFillCell(ecartRow,3);

  // Data validation Type
  ws.dataValidations.add('B'+start3+':B'+last3, {
    type:'list', allowBlank:true, formulae:['"Dividende,Frais,Autre,Vente"']
  });

  // ===== SECTION 4: SYNTHESE =====
  var sec4 = ecartRow+2;
  titleRow(sec4, 'SYNTHÈSE', 6);
  r = sec4+1;
  var VALEUR_ACTUELLE_CELL = null, PVLAT_CELL = null;
  [
    ['Total des fonds versés', TOTAL1],
    ['Total investi en titres (brut)', TOTAL2],
    ['Total dividendes reçus', tdiv.address],
    ["Total ventes d'actions", TOTAL_VENTES],
    ['Plus/moins-value réalisée', TOTAL_PV],
    ['Valeur actuelle du portefeuille', 'SUM('+POSC_VALEUR+')'],
    ['Plus/moins-value latente', 'SUM('+POSC_PVLAT+')']
  ].forEach(function(pair){
    ws.mergeCells(r,1,r,4);
    ws.getCell(r,1).value = pair[0];
    ws.getCell(r,1).alignment = {horizontal:'right'};
    var cell = formulaCell(r,5,pair[1],CUR);
    borderRow(r,5);
    if(pair[0].indexOf('Valeur actuelle')===0) VALEUR_ACTUELLE_CELL = cell.address;
    if(pair[0].indexOf('Plus/moins-value latente')===0) PVLAT_CELL = cell.address;
    r++;
  });
  var perfRow = r;
  ws.mergeCells(perfRow,1,perfRow,4);
  ws.getCell(perfRow,1).value = 'Performance globale';
  ws.getCell(perfRow,1).alignment = {horizontal:'right'};
  formulaCell(perfRow,5,'IF('+TOTAL2+'=0,0,('+VALEUR_ACTUELLE_CELL+'+'+tdiv.address+'+'+TOTAL_VENTES+'-'+TOTAL2+')/'+TOTAL2+')',PCT);
  borderRow(perfRow,5);
  r = perfRow+1;
  var soldeRow = r;
  ws.mergeCells(soldeRow,1,soldeRow,4);
  ws.getCell(soldeRow,1).value = 'Liquidité théorique restante';
  ws.getCell(soldeRow,1).font = {bold:true};
  ws.getCell(soldeRow,1).alignment = {horizontal:'right'};
  var sc = formulaCell(soldeRow,5,LIQ_THEO,CUR); sc.font={bold:true};
  for(var c=1;c<=5;c++){ totalFillCell(soldeRow,c); ws.getCell(soldeRow,c).border = thinBorder(); }

  ws.views = [{state:'frozen', ySplit:4}];

  // ===== SHEET 2: DIVIDENDES =====
  var ws2 = wb.addWorksheet('Dividendes');
  ws2.columns = [{width:5},{width:18},{width:8},{width:16},{width:15},{width:14},{width:14},{width:12},{width:14}];
  ws2.mergeCells(1,1,1,9);
  ws2.getCell(1,1).value = 'HISTORIQUE DES DIVIDENDES';
  ws2.getCell(1,1).font = {bold:true, size:14, color:{argb:NAVY}};
  ws2.getCell(1,1).alignment = {horizontal:'center'};

  var hrowD = 3;
  var headersD = ['N°','Titre','Année','Date détachement','Dividende/action','Nb titres retenu','Total dividende','CUMP','Capital retenu'];
  headersD.forEach(function(h,i){
    var c = ws2.getCell(hrowD, i+1);
    c.value = h;
    c.font = {bold:true, size:11, color:{argb:'FFFFFFFF'}};
    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:NAVY}};
    c.alignment = {horizontal:'center', wrapText:true};
    c.border = thinBorder();
  });
  var startD = hrowD+1;
  var divList = state.dividendes || [];
  divList.forEach(function(d, idx){
    var rr = startD+idx;
    ws2.getCell(rr,1).value = idx+1;
    ws2.getCell(rr,2).value = d.titre;
    ws2.getCell(rr,3).value = d.annee;
    var dcell = ws2.getCell(rr,4);
    dcell.value = d.dateDetachement ? new Date(d.dateDetachement) : null;
    dcell.font = {color:{argb:'FF0000FF'}};
    dcell.numFmt = DATEFMT;
    var divCell = ws2.getCell(rr,5);
    divCell.value = Number(d.dividendeParAction)||0;
    divCell.font = {color:{argb:'FF0000FF'}};
    divCell.numFmt = CUR;
    if(d.dateDetachement){
      ws2.getCell(rr,6).value = {formula:
        'MAX(0,SUMIFS(Bilan!'+ACH_QTE+',Bilan!'+ACH_TITRE+',B'+rr+',Bilan!'+ACH_DATEVAL+',"<="&D'+rr+')'+
        '-SUMIFS(Bilan!'+VTE_QTE+',Bilan!'+VTE_TITRE+',B'+rr+',Bilan!'+VTE_DATEVAL+',"<="&D'+rr+'))'
      };
    } else {
      ws2.getCell(rr,6).value = 0;
    }
    ws2.getCell(rr,6).numFmt = '#,##0';
    ws2.getCell(rr,7).value = {formula:'E'+rr+'*F'+rr}; ws2.getCell(rr,7).numFmt = CUR;
    ws2.getCell(rr,8).value = {formula:'IFERROR(SUMIFS(Bilan!'+ACH_MONTANT+',Bilan!'+ACH_TITRE+',B'+rr+',Bilan!'+ACH_DATEVAL+',"<="&D'+rr+')/SUMIFS(Bilan!'+ACH_QTE+',Bilan!'+ACH_TITRE+',B'+rr+',Bilan!'+ACH_DATEVAL+',"<="&D'+rr+'),0)'};
    ws2.getCell(rr,8).numFmt = CUR;
    ws2.getCell(rr,9).value = {formula:'F'+rr+'*H'+rr}; ws2.getCell(rr,9).numFmt = CUR;
    for(var cc=1;cc<=9;cc++) ws2.getCell(rr,cc).border = thinBorder();
  });
  var lastD = divList.length ? (startD+divList.length-1) : startD-1;
  if(lastD < startD){ for(var cc=1;cc<=9;cc++) ws2.getCell(startD,cc).border = thinBorder(); lastD = startD; }

  var recTitleRow = lastD+2;
  ws2.mergeCells(recTitleRow,1,recTitleRow,9);
  ws2.getCell(recTitleRow,1).value = 'Totaux par année';
  ws2.getCell(recTitleRow,1).font = {bold:true, size:10, color:{argb:NAVY}};
  ws2.getCell(recTitleRow,1).fill = {type:'pattern', pattern:'solid', fgColor:{argb:SUBHEAD}};
  ws2.getCell(recTitleRow,1).alignment = {horizontal:'center'};
  var recHrow = recTitleRow+1;
  ['Année','Total dividendes','Capital investi retenu','Rendement global'].forEach(function(h,i){
    var c = ws2.getCell(recHrow,i+1);
    c.value = h; c.font = {bold:true,size:11,color:{argb:'FFFFFFFF'}};
    c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:NAVY}};
    c.alignment = {horizontal:'center', wrapText:true}; c.border = thinBorder();
  });
  var recStart = recHrow+1;
  years.forEach(function(y, idx){
    var rr = recStart+idx;
    inputCell(rr,1,y,null,ws2);
    var totF = formulaCell(rr,2,'SUMIF(C'+startD+':C'+lastD+',A'+rr+',G'+startD+':G'+lastD+')',CUR,ws2);
    var capF = formulaCell(rr,3,'SUMIF(C'+startD+':C'+lastD+',A'+rr+',I'+startD+':I'+lastD+')',CUR,ws2);
    formulaCell(rr,4,'IF(C'+rr+'=0,0,B'+rr+'/C'+rr+')',PCT,ws2);
    for(var cc=1;cc<=4;cc++) ws2.getCell(rr,cc).border = thinBorder();
    divMovementRows[y] && (function(){
      formulaCell(divMovementRows[y],5,"Dividendes!B"+rr,CUR);
    })();
  });

  ws2.views = [{state:'frozen', xSplit:3, ySplit:3}];

  return wb;
}

/* ---------- Export Excel (.xlsx) via ExcelJS (charge depuis un CDN a la demande) ---------- */
var EXCELJS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
var exceljsLoadPromise = null;
function ensureExcelJS(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(exceljsLoadPromise) return exceljsLoadPromise;
  exceljsLoadPromise = new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = EXCELJS_CDN;
    s.onload = function(){
      if(window.ExcelJS) resolve(window.ExcelJS);
      else reject(new Error("ExcelJS introuvable apres chargement"));
    };
    s.onerror = function(){ reject(new Error("Impossible de charger la bibliotheque Excel (connexion internet requise)")); };
    document.head.appendChild(s);
  });
  return exceljsLoadPromise;
}
async function exportToXlsx(btn){
  var original = btn.textContent;
  btn.textContent = 'Préparation…';
  btn.disabled = true;
  try{
    var ExcelJSLib = await ensureExcelJS();
    var wb = buildWorkbook(ExcelJSLib, Object.assign({}, state, {coursActuels: coursEffectifs()}));
    var buffer = await wb.xlsx.writeBuffer();
    var blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var today = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'Bilan_compte_titre_brvm_'+today+'.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  }catch(err){
    alert("Export Excel impossible : "+(err && err.message ? err.message : "erreur inconnue")+". Verifie ta connexion internet, ou utilise l'export JSON a la place.");
  }finally{
    btn.textContent = original;
    btn.disabled = false;
  }
}

document.getElementById('app').addEventListener('click', function(e){
  if(e.target.id === 'btn-export-xlsx'){
    exportToXlsx(e.target);
    return;
  }
  if(e.target.id === 'btn-export'){
    try{
      var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var today = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = 'compte-titre-brvm-'+today+'.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }catch(err){ alert('Export impossible sur ce navigateur.'); }
    return;
  }
  if(e.target.id === 'btn-import'){
    document.getElementById('file-import').click();
    return;
  }
  var autoAllBtn = e.target.closest('[data-autoall]');
  if(autoAllBtn){
    if(!autoAllBtn.classList.contains('confirming')){
      autoAllBtn.classList.add('confirming');
      autoAllBtn.textContent = 'Confirmer ?';
      return;
    }
    state.coursActuels = {};
    render(); scheduleSave();
    return;
  }
  var exactEl = e.target.closest('[data-exact]');
  if(exactEl){
    showExact(exactEl.dataset.exact);
    return;
  }
  var addBtn = e.target.closest('[data-add]');
  if(addBtn){
    openForm(addBtn.dataset.add, null);
    return;
  }
  var restoreBtn = e.target.closest('[data-restore]');
  if(restoreBtn){
    var rid = restoreBtn.dataset.restore;
    var idx = state.corbeille.findIndex(function(x){return x.id===rid;});
    if(idx > -1){
      var entry = state.corbeille.splice(idx,1)[0];
      state[entry.listName].push(entry.item);
    }
    render(); scheduleSave();
    return;
  }
  var purgeBtn = e.target.closest('[data-purge]');
  if(purgeBtn){
    if(!purgeBtn.classList.contains('confirming')){
      purgeBtn.classList.add('confirming');
      purgeBtn.textContent = 'Confirmer ?';
      return;
    }
    var pid = purgeBtn.dataset.purge;
    state.corbeille = state.corbeille.filter(function(x){return x.id!==pid;});
    render(); scheduleSave();
    return;
  }
  var card = e.target.closest('[data-open]');
  if(!card) return;
  openForm(card.dataset.open, card.dataset.id);
});
